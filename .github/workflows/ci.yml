name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OTP_VERSION: "28.1"
  ELIXIR_VERSION: "1.19.5"
  MIX_ENV: "test"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format — pure formatting check, fast.
  # ---------------------------------------------------------------------------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Check formatting
        run: mix format --check-formatted

  # ---------------------------------------------------------------------------
  # 2. Lint — credo strict + dialyzer as separate jobs.
  # ---------------------------------------------------------------------------
  lint:
    name: Credo Strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Alaja depends on pote via git URL. Convert SSH to HTTPS for CI.
      - name: Fix git SSH → HTTPS for dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo (strict)
        run: mix credo --strict

  # ---------------------------------------------------------------------------
  # 3. Compile + test with coverage — main quality gate.
  #    Uses --warnings-as-errors so the compile step rejects any warning,
  #    and excludes :external network-bound tests so CI is deterministic.
  # ---------------------------------------------------------------------------
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # Compile with --warnings-as-errors as a quality gate. Anything that
      # would have been a warning becomes a hard failure here.
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors --force

      - name: Run tests with coverage
        run: mix test --cover

      - name: Generate coverage report
        if: success()
        run: |
          if [ -f cover/excoveralls.json ]; then
            mix coveralls.github -t "J-${{ github.run_id }};L-${{ github.run_attempt }};S-${{ github.sha }}"
          fi

  # ---------------------------------------------------------------------------
  # 4. Dialyzer — runs only on main to keep PR cycle fast. Catches type
  #    contract regressions that unit tests don't see.
  # ---------------------------------------------------------------------------
  typespecs:
    name: Dialyzer
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dialyzer-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-dialyzer-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-dialyzer-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --force

      - name: Build PLT (cacheable)
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --no-check

  # ---------------------------------------------------------------------------
  # 5. Dependency security audit.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          install-hex: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-audit-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-audit-

      - name: Install dependencies
        run: mix deps.get

      - name: Hex audit
        run: mix hex.audit
