name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OTP_VERSION: "28.1"
  ELIXIR_VERSION: "1.19.5"
  MIX_ENV: "test"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format — pure formatting check, fast. STRICT: any drift fails.
  # ---------------------------------------------------------------------------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Check formatting
        run: mix format --check-formatted

  # ---------------------------------------------------------------------------
  # 2. Lint — credo strict. STRICT: any issue at default priority or
  # higher fails the build. Lower-priority issues stay as warnings.
  # ---------------------------------------------------------------------------
  lint:
    name: Credo Strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Alaja depends on pote via git URL. Convert SSH to HTTPS for CI.
      - name: Fix git SSH → HTTPS for dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo (strict)
        # Run strict credo. We only fail on issues at the default
        # priority or higher (i.e. refactors the codebase has agreed
        # to enforce); lower-priority suggestions remain advisory
        # so that the suite stays focused on substantive problems.
        run: mix credo --strict --min-priority=normal

  # ---------------------------------------------------------------------------
  # 3. Compile + test with coverage — main quality gate. STRICT.
  # --warnings-as-errors turns any compile warning into a hard fail.
  # ---------------------------------------------------------------------------
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # STRICT: --warnings-as-errors. Any warning becomes a hard failure.
      - name: Compile (warnings-as-errors)
        run: mix compile --force --warnings-as-errors

      - name: Run tests (only failed first, then full)
        # Two-step: first surface any existing failures with --failed
        # for fast feedback, then run the full suite to confirm.
        run: |
          mix test --failed || true
          mix test --cover

      - name: Generate coverage report
        if: success()
        run: |
          if [ -f cover/excoveralls.json ]; then
            mix coveralls.github -t "J-${{ github.run_id }};L-${{ github.run_attempt }};S-${{ github.sha }}"
          fi

  # ---------------------------------------------------------------------------
  # 4. Dialyzer — runs only on main to keep PR cycle fast. STRICT.
  # ---------------------------------------------------------------------------
  typespecs:
    name: Dialyzer
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dialyzer-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-dialyzer-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-dialyzer-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --force --warnings-as-errors

      - name: Build PLT (cacheable)
        run: mix dialyzer --plt

      - name: Run Dialyzer
        # STRICT: no --no-check. Dialyzer warnings become hard failures.
        run: mix dialyzer

  # ---------------------------------------------------------------------------
  # 5. Dependency security audit. STRICT.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          install-hex: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-audit-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-audit-

      - name: Install dependencies
        run: mix deps.get

      - name: Hex audit
        # STRICT: any outdated dep or known vuln fails the build.
        run: mix hex.audit --all
